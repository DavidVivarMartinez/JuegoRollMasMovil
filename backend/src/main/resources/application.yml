spring:
  application:
    name: eclipse-backend
  config:
    import: classpath:game-content.yml   # misiones, archivos, objetos y mapa iniciales (prefijo game.*)
  datasource:
    # En local lo sobreescribe docker compose; en Render llegan DB_* desde render.yaml.
    # Para Neon u otro Postgres externo basta con SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eclipse}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USER:eclipse}
    password: ${DB_PASSWORD:eclipse}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  docker:
    compose:
      file: ../compose.yaml
      lifecycle-management: start-only
  threads:
    virtual:
      enabled: true

server:
  # 8090 en local (el 8080 de este PC lo usa otro contenedor de Docker); en Render llega por PORT
  port: ${PORT:8090}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    es.eclipse: INFO

app:
  cors:
    # Orígenes permitidos para peticiones de otro origen (patrones). En desarrollo: el PC y los móviles de la red local.
    # En producción pon aquí el dominio real del frontend (APP_CORS_ALLOWED_ORIGINS_0=https://...).
    allowed-origins:
      - "http://localhost:*"
      - "https://localhost:*"
      - "http://127.0.0.1:*"
      - "https://127.0.0.1:*"
      - "http://192.168.*.*:*"
      - "https://192.168.*.*:*"
      - "http://10.*.*.*:*"
      - "https://10.*.*.*:*"
  join:
    max-attempts-per-minute: 10
  realtime:
    allowed-origin-patterns:
      - "*"
  seed:
    # Crea la partida de ejemplo si la base de datos está vacía.
    # CAMBIA LOS CÓDIGOS antes de la partida real (variables de entorno APP_SEED_*).
    enabled: true
    print-codes: true
    session-name: "PROTOCOLO: ECLIPSE"
    master-name: "Máster"
    master-code: "ECLIPSE-MASTER"
    # Pantalla de mesa (la TV conectada al ordenador): entra con este código y muestra lo que decide el máster
    display-name: "Pantalla de mesa"
    display-code: "PANTALLA-MESA"
    players:
      - name: David
        character: Ingeniero
        character-code: ENGINEER
        code: "ING-7731"
        infection: 0
      - name: Laura
        character: Médica
        character-code: MEDIC
        code: "MED-2048"
        infection: 12
      - name: Carlos
        character: Seguridad
        character-code: SECURITY
        code: "SEG-0917"
        infection: 0
      - name: Ana
        character: Científica
        character-code: SCIENTIST
        code: "CIE-6618"
        infection: 67
