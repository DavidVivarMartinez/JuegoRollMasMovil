# =====================================================================
#  PROTOCOLO: ECLIPSE — contenido inicial de la partida
#  Se carga una sola vez por partida (cuando no hay misiones creadas).
#  Todo es editable después desde el panel del máster.
#  Estados: misiones HIDDEN/ACTIVE/DONE/FAILED · archivos HIDDEN/UNLOCKED/CORRUPTED
#  Sectores: UNKNOWN/OPEN/LOCKED/QUARANTINE/DANGER/DESTROYED
# =====================================================================
game:
  shared-missions:
    - code: FIND_NEXUS7
      title: Localizar la NEXUS-7
      status: ACTIVE
      description: >-
        La nave científica NEXUS-7 desapareció hace 11 días tras investigar una señal procedente
        de esta estación. Confirmad su posición y el estado de su tripulación.
    - code: RESTORE_POWER
      title: Restaurar la energía
      status: ACTIVE
      description: >-
        El reactor funciona en modo de reserva. Sin potencia completa no se pueden abrir las compuertas
        del nivel inferior ni activar el sistema de atraque.
    - code: RECOVER_DATA
      title: Recuperar los datos
      status: ACTIVE
      description: >-
        La corporación exige el volcado íntegro del laboratorio central. Prioridad: registros del
        proyecto en curso.
    - code: FIND_OUT
      title: Descubrir qué ocurrió
      status: ACTIVE
      description: >-
        Las cámaras registran movimiento en zonas que deberían estar vacías. Determinad qué pasó con
        el personal de la estación.
    - code: EVAC_SHIP
      title: Activar la nave de evacuación
      status: HIDDEN
      description: >-
        La nave de evacuación necesita potencia del reactor y el código del protocolo de evacuación.
        Solo hay plazas para cuatro.
    - code: DECIDE_ECLIPSE
      title: Decidir qué hacer con ECLIPSE
      status: HIDDEN
      description: >-
        Destruir la estación, extraer una muestra o intentar comunicarse. No hay una opción sin coste.

  shared-files:
    - code: STATION_NOTICE
      title: Aviso automático de la estación
      classification: PUBLIC
      status: UNLOCKED
      body: |
        >> TRANSMISIÓN AUTOMÁTICA · ESTACIÓN EREBUS-ORBITAL · CICLO 4471

        PROTOCOLO DE CONTENCIÓN BIOLÓGICA ACTIVADO.
        Personal no autorizado deberá abandonar inmediatamente la estación.

        ADVERTENCIA.
        La tripulación de NEXUS-7 no debe ser considerada humana.

        >> FIN DE LA TRANSMISIÓN · REPETICIÓN EN 00:30:00
    - code: SCIENCE_LOG_41
      title: Diario del jefe científico · entrada 41
      classification: RESTRICTED
      status: HIDDEN
      body: |
        Entrada 41. Dra. Imara Vey, jefa científica.

        Lo que las perforadoras sacaron del estrato 9 no es mineral. Tampoco es un virus, por mucho
        que Halvorsen insista. Reconstruye tejido muerto. Lo hace usando lo que queda en el tejido:
        recuerdos, patrones, hábitos. El ratón de la jaula 3 volvió a recorrer su laberinto sin un
        solo error. Llevaba catorce horas muerto.

        Halvorsen quiere probarlo con el cuerpo de Oyelaran. Yo quiero cerrar el sector 17 y pedir
        una evacuación. Lo hemos votado. He perdido.

        Lo llamaremos ECLIPSE. Es una forma de hablar de ello sin decir lo que es.
    - code: INFECTION_PHASES
      title: Registro médico · progresión del huésped
      classification: RESTRICTED
      status: HIDDEN
      body: |
        PROGRESIÓN OBSERVADA EN HUÉSPEDES VIVOS (n = 6)

        FASE 1 · CONTAMINACIÓN
        Sin síntomas visibles. Marcadores detectables únicamente mediante cribado profundo.

        FASE 2 · ALTERACIÓN
        Errores de memoria reciente. Confusión. Cambios de personalidad sutiles que el propio huésped
        no percibe. Los compañeros sí.

        FASE 3 · SINCRONIZACIÓN
        El organismo asume el control de grupos musculares. Temblores, gestos repetidos, pausas largas.
        El huésped lo racionaliza.

        FASE 4 · ECLIPSE
        El huésped conserva lenguaje, recuerdos y afectos. No se ha podido determinar si conserva algo
        más. Recomendación: no considerarlo humano.

        NOTA: un huésped en cualquier fase puede hablar, razonar y mentir. Y puede no saber que lo está.
    - code: NEXUS7_MANIFEST
      title: Manifiesto de la NEXUS-7
      classification: PUBLIC
      status: HIDDEN
      body: |
        NAVE CIENTÍFICA NEXUS-7 · REGISTRO CORPORATIVO 88-K
        Tripulación: 5. Misión: investigación de señal anómala, órbita de Erebus.

        CMDT. Rhee, Soo-ah
        OF. Castellanos, Mateo
        DRA. Nwosu, Adaeze
        TÉC. Lindqvist, Pär
        TÉC. Amari, Youssef

        Último mensaje recibido (hace 11 días, 03:14 hora de a bordo):
        "Hemos atracado. Las luces están encendidas. Hay alguien en el puente. Nos está saludando."
    - code: EVAC_PROTOCOL
      title: Protocolo de evacuación · nivel inferior
      classification: RESTRICTED
      status: HIDDEN
      body: |
        SECUENCIA DE ACTIVACIÓN DE LA NAVE DE EVACUACIÓN

        1. Reactor al 60 % o superior.
        2. Desbloquear la esclusa del nivel inferior desde el puente de mando.
        3. Introducir el código de autorización en la consola de la nave.
        4. Ocupar los asientos. La secuencia de desacople dura 180 segundos y NO puede abortarse.

        CÓDIGO DE AUTORIZACIÓN: 7-7-3-1-EREBUS
        Capacidad: 4 ocupantes. Los asientos restantes carecen de soporte vital.
    - code: SECURITY_LOG
      title: Registro de seguridad · hace 6 meses
      classification: CLASSIFIED
      status: HIDDEN
      body: |
        INCIDENTE 0219 · SECTOR 17 · TURNO DE NOCHE

        Agente de seguridad abre fuego contra un miembro del equipo científico dentro de la zona de
        cuarentena. El agente declara que el científico "ya no era él". El científico había sido
        declarado muerto 31 horas antes.

        El agente es evacuado, sedado y sometido a cribado. Resultado: negativo.
        Resolución corporativa: borrado de la participación del agente en el proyecto. Reasignación.

        Nombre del agente: [SUPRIMIDO POR ORDEN 7-ALFA]

  # Coordenadas en una rejilla de 100x100 (casillas de 16x10): columnas en x = 10, 30, 50, 70, 90.
