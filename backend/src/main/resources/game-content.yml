  characters:
    ENGINEER:
      missions:
        - code: REPAIR_SYSTEMS
          kind: OFFICIAL
          title: Reparar los sistemas de la estación
          status: ACTIVE
          description: >-
            Devolver la operatividad a la red eléctrica, las compuertas y el sistema de atraque.
            Sin ti nadie sale de aquí.
        - code: CORP_ORDER
          kind: SECRET
          title: Orden 7-ALFA (confidencial)
          status: ACTIVE
          description: >-
            Antes de partir recibiste un archivo cifrado de la corporación. La misión real es recuperar
            el organismo catalogado como ECLIPSE. Si encuentras muestras, consérvalas. Aunque haya
            supervivientes. Nadie más conoce esta orden.
      items:
        - name: Kit de reparación
          description: Herramientas y piezas para una reparación de campo. Dos usos.
          quantity: 2
          usable: true
          consumable: true
        - name: Terminal de diagnóstico
          description: Lee el estado de cualquier sistema de la estación al que te conectes.
          usable: true
        - name: Linterna
          description: Luz de 200 lúmenes. Batería al 80 %.
          usable: false
      files:
        - code: CORP_DIRECTIVE
          title: Directiva 7-ALFA · Proyecto ECLIPSE
          classification: CLASSIFIED
          status: UNLOCKED
          body: |
            DE: Dirección de Activos Biológicos
            PARA: Ingeniero jefe, misión de recuperación EREBUS
            CLASIFICACIÓN: 7-ALFA · SOLO LECTOR AUTORIZADO

            La estación EREBUS-ORBITAL alberga un activo biológico de valor incalculable, nombre en
            clave ECLIPSE. El objetivo real de su misión es la recuperación de al menos una muestra viable.

            Instrucciones:
            · No comparta esta directiva con el resto del equipo.
            · El laboratorio central dispone de contenedores de transporte homologados.
            · La supervivencia de terceros es deseable pero no prioritaria.
            · A su regreso será compensado conforme a la tabla 7-ALFA/4.

            Esta directiva se autodestruirá al finalizar la misión.

    MEDIC:
      missions:
        - code: EVALUATE_SURVIVORS
          kind: OFFICIAL
          title: Evaluar a los supervivientes
          status: ACTIVE
          description: >-
            Determinar el estado médico de cualquier superviviente de la estación o de la NEXUS-7 y
            decidir si puede viajar con vosotros.
        - code: MARKERS
          kind: SECRET
          title: Marcadores anómalos
          status: ACTIVE
          description: >-
            Una transmisión médica previa al despegue indica que uno de los miembros del equipo presenta
            marcadores compatibles con infección. No sabes quién. Observa, confirma y solo entonces informa.
      items:
        - name: Botiquín
          description: Estabiliza heridas y detiene hemorragias. Dos usos.
          quantity: 2
          usable: true
          consumable: true
        - name: Escáner biométrico portátil
          description: Lectura rápida de constantes y marcadores. No es un cribado profundo.
          usable: true
        - name: Sedantes
          description: Dosis única. Deja fuera de combate a un adulto durante una hora.
          quantity: 1
          usable: true
          consumable: true
      files:
        - code: PRE_SCREEN
          title: Cribado médico pre-misión
          classification: RESTRICTED
          status: UNLOCKED
          body: |
            CRIBADO DE EMBARQUE · TRANSPORTE DE RECUPERACIÓN · 4 SUJETOS

            MUESTRA 1 · negativo
            MUESTRA 2 · negativo
            MUESTRA 3 · NO CONCLUYENTE · marcadores compatibles con contaminación de fase 1 · repetir
            MUESTRA 4 · negativo

            NOTA DEL LABORATORIO: las muestras se anonimizaron por protocolo. La correspondencia
            muestra/sujeto no se adjunta a este informe.

    SECURITY:
      missions:
        - code: KEEP_ALIVE
          kind: OFFICIAL
          title: Mantener viva a la tripulación
          status: ACTIVE
          description: >-
            Eres el único con formación táctica. Decide cuándo se avanza, cuándo se retrocede y
            cuándo se cierra una puerta.
        - code: BEEN_HERE
          kind: SECRET
          title: Ya has estado aquí
          status: ACTIVE
          description: >-
            Hace seis meses formabas parte del equipo de seguridad de esta estación. La corporación
            borró tu participación. Recuerdas haber matado a alguien. No recuerdas por qué.
      items:
        - name: Pistola de aturdimiento
          description: Tres cargas. Inmoviliza, no mata.
          quantity: 3
          usable: true
          consumable: true
        - name: Tarjeta de acceso · nivel 2
          description: Abre compuertas de seguridad de nivel 2 o inferior.
          usable: true
        - name: Bengala
          description: Luz intensa durante 60 segundos. Un uso.
          quantity: 1
          usable: true
          consumable: true
      files:
        - code: SERVICE_RECORD
          title: Expediente de servicio · EREBUS
          classification: CLASSIFIED
          status: CORRUPTED
          body: |
            EXPEDIENTE DE SERVICIO · DESTINO: EREBUS-ORBITAL · DURACIÓN: 4 MESES

            Agente asignado a la cuarentena del sector 17. Evaluaciones: satisfactorias.
            Incidente 0219: el agente abre fuego contra un miembro del equipo científico que había sido
            declarado muerto 31 horas antes. El agente declara que el científico ya no era él.

            Cribado posterior: negativo. Sedación. Evacuación.
            Resolución: borrado de memoria selectivo autorizado por orden 7-ALFA. Reasignación.

            Observación del médico: el agente pregunta por el científico cada mañana. Cada mañana
            le decimos que no conoce a nadie con ese nombre.

    SCIENTIST:
      missions:
        - code: RECOVER_SCIENCE
          kind: OFFICIAL
          title: Recuperar los datos científicos
          status: ACTIVE
          description: >-
            Eres la única capaz de interpretar lo que haya en el laboratorio central. Recupera los
            registros del proyecto y determina qué estaban investigando.
        - code: ACCIDENT
          kind: SECRET
          title: El accidente
          status: ACTIVE
          description: >-
            Durante el viaje sufriste un accidente en la bodega 2. Despertaste horas después en la
            enfermería del transporte, sin heridas. Nadie te ha explicado qué pasó y los registros de
            ese tramo del viaje están vacíos.
      items:
        - name: Tableta de datos
          description: Descifra y almacena registros del laboratorio.
          usable: true
        - name: Contenedor de muestras
          description: Aislamiento biológico de clase 4. Capacidad para una muestra.
          usable: true
        - name: Linterna
          description: Luz de 200 lúmenes. Batería al 100 %.
          usable: false
      files:
        - code: TRIP_INCIDENT
          title: Registro del incidente · bodega 2
          classification: RESTRICTED
          status: HIDDEN
          body: |
            REGISTRO MÉDICO AUTOMÁTICO · TRANSPORTE DE RECUPERACIÓN · DÍA 3 DE VIAJE

            04:12:40 · Caída detectada en bodega 2. Sujeto: científica de la misión.
            04:12:58 · Constantes vitales: AUSENTES.
            04:13:00 · Alerta enviada a la tripulación. Sin respuesta (ciclo de descanso).
            ..........
            04:55:17 · Constantes vitales: RESTABLECIDAS. Sin intervención registrada.
            04:55:20 · Sujeto consciente. Sujeto se incorpora. Sujeto pregunta la hora.

            Duración de la ausencia de constantes: 00:42:17.
            Este registro ha sido marcado para borrado por orden 7-ALFA.
        - code: PATIENT_01
          title: Paciente ECLIPSE-01
          classification: CLASSIFIED
          status: HIDDEN
          body: |
            PACIENTE ECLIPSE-01 · PRIMER HUÉSPED HUMANO ESTABLE

            Fallecimiento confirmado. Reconstrucción completa en menos de una hora. El sujeto conserva
            memoria, lenguaje, afectos y competencias profesionales. No presenta conciencia de su estado.

            Lectura biométrica: errores intermitentes. Sincronización: 67 % y en aumento.

            El sujeto no está en la estación. El sujeto viaja hacia la estación.

  # fin
