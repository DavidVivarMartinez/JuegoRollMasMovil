# Perfil de produccion (SPRING_PROFILES_ACTIVE=prod). Todo lo sensible llega por variables de entorno.
spring:
  docker:
    compose:
      enabled: false

app:
  seed:
    print-codes: false
  # Dominio del frontend en Netlify (CORS y WebSocket). FRONTEND_ORIGIN puede añadir otro dominio o patrón
  # (p. ej. uno propio); el sitio de Netlify actual queda siempre permitido.
  cors:
    allowed-origins:
      - https://nexus-7-terminal.netlify.app
      - ${FRONTEND_ORIGIN:https://nexus-7-terminal.netlify.app}
  realtime:
    allowed-origin-patterns:
      - https://nexus-7-terminal.netlify.app
      - ${FRONTEND_ORIGIN:https://nexus-7-terminal.netlify.app}

logging:
  level:
    es.eclipse: INFO
