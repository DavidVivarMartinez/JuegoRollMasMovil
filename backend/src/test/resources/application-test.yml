# Perfil de tests: H2 en memoria en modo PostgreSQL, sin Docker.
spring:
  datasource:
    url: jdbc:h2:mem:eclipse;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  docker:
    compose:
      enabled: false

app:
  seed:
    enabled: true
    print-codes: false
