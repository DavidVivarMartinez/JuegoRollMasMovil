# Blueprint de Render: backend (Docker) + PostgreSQL.
# En Render: New > Blueprint > conectar este repositorio. Solo pide un nombre para el Blueprint (cualquiera).
# El PostgreSQL gratuito de Render caduca a los 30 días; para algo estable, cámbialo por Neon
# definiendo SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.

services:
  - type: web
    name: protocolo-eclipse-api   # URL: https://protocolo-eclipse-api.onrender.com
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free            # cambia a "starter" el mes de la partida para que no se duerma
    region: frankfurt
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC
      # Dominio del frontend en Netlify (CORS y WebSocket). Si cambias el nombre del sitio, cámbialo aquí.
      - key: FRONTEND_ORIGIN
        value: https://nexus-7-terminal.netlify.app
      # Base de datos (rellenado automáticamente desde el servicio de abajo)
      - key: DB_HOST
        fromDatabase:
          name: eclipse-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: eclipse-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: eclipse-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: eclipse-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: eclipse-db
          property: password
      # Los códigos de acceso se cargan solos en la base de datos al primer arranque (los de application.yml).
      # Cámbialos desde el panel del máster: ESTACIÓN > CÓDIGOS DE ACCESO.

databases:
  - name: eclipse-db
    plan: free
    region: frankfurt
    databaseName: eclipse
    user: eclipse
    postgresMajorVersion: "17"
